<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lo-Fi Serene</title>
    <meta name="description" content="Calm illustrated scenes with gentle motion and a built-in lo-fi radio for studying and sleeping." />
    <meta name="theme-color" content="#0b101b" />
    <meta property="og:title" content="Lo-Fi Serene" />
    <meta property="og:description" content="Calm illustrated scenes with gentle motion and a built-in lo-fi radio for studying and sleeping." />
    <meta property="og:image" content="assets/thumbs/og-image.jpg" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230b101b'/%3E%3Crect x='22' y='16' width='20' height='30' rx='9' fill='%23ffb454'/%3E%3Crect x='29' y='9' width='6' height='7' rx='2' fill='%23c25e1e'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="stage" aria-label="Interactive 2.5D Lo-Fi Diorama">
      <canvas id="diorama-canvas"></canvas>
      <div class="scene-veil" aria-hidden="true"></div>
      <div class="scene-grain" aria-hidden="true"></div>
      <button id="btn-torch" class="scene-hotspot" type="button" aria-label="Flashlight"
        aria-pressed="false" title="Switch flashlight on or off" hidden></button>

      <header class="title-card" aria-label="Scene title">
        <div id="title-native" class="title-jp">A Rooftop Sleepover</div>
        <h1 id="title-en" class="title-en">Summer Night on the Terrace</h1>
        <p id="title-sub" class="subtitle">A rooftop sleepover under the summer stars</p>
      </header>

      <div
        id="scene-switcher"
        class="scene-switcher"
        role="toolbar"
        focusgroup="toolbar wrap"
        aria-label="Choose diorama scene"
        aria-controls="diorama-canvas"
      ></div>

      <p id="toast" class="toast" role="status" aria-live="polite"></p>

      <!-- Minimal bottom-right corner launcher (keeps foreground scene 100% unobstructed) -->
      <div class="corner-launcher">
        <button id="btn-enable-sound" class="corner-btn corner-btn--primary" type="button" hidden>
          Tap for sound
        </button>
        <button
          id="btn-quick-pause"
          class="corner-btn"
          type="button"
          aria-label="Pause scene animation"
          title="Pause or resume scene animation"
        >
          <span aria-hidden="true">❚❚</span>
        </button>
        <button
          id="btn-fullscreen"
          class="corner-btn"
          type="button"
          aria-label="Full screen"
          aria-pressed="false"
          title="Full screen (F)"
          hidden
        >
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
            <path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4" />
          </svg>
        </button>
        <button
          id="btn-controls-trigger"
          class="corner-btn corner-btn--primary"
          type="button"
          popovertarget="controls-popover"
          aria-controls="controls-popover"
          aria-expanded="false"
        >
          <span class="dot" aria-hidden="true"></span>
          <span>Controls</span>
        </button>
      </div>

      <!-- On-demand top-layer Controls Popover (Esc or click outside to light-dismiss) -->
      <aside
        id="controls-popover"
        class="controls-popover"
        popover="auto"
        aria-label="Diorama controls"
      >
        <div class="popover-header">
          <span class="popover-title">Controls</span>
          <button
            type="button"
            class="popover-close"
            popovertarget="controls-popover"
            popovertargetaction="hide"
            aria-label="Close controls"
          >
            ✕
          </button>
        </div>

        <section class="control-section" aria-label="Soundscape">
          <h2 class="section-label">Soundscape</h2>
          <div class="control-row">
            <button
              id="btn-ambience"
              class="hud-btn"
              type="button"
              aria-pressed="false"
              title="Toggle spatial breeze, rain, stream, and chimes"
            >
              <span class="dot" aria-hidden="true"></span>
              <span>Ambience</span>
            </button>
            <button
              id="btn-radio"
              class="hud-btn"
              type="button"
              aria-pressed="true"
              title="Play or pause the lo-fi radio"
            >
              <span class="dot" aria-hidden="true"></span>
              <span>Lo-Fi Radio</span>
            </button>
          </div>
          <div class="volume-row">
            <label class="yt-vol-label" for="radio-volume">
              <span>Volume</span>
              <input
                id="radio-volume"
                class="yt-vol-slider"
                type="range"
                min="0"
                max="100"
                value="70"
                aria-label="Music volume"
              />
            </label>
          </div>
          <details class="yt-details">
            <summary>Use your own music (YouTube)</summary>
            <div class="yt-details-body">
              <div class="yt-radio-bar yt-radio-bar--tools">
                <button
                  id="btn-yt-mini"
                  class="yt-mini-toggle"
                  type="button"
                  title="Show or hide the YouTube mini-player (to click Play or Skip Ad)"
                >
                  Show Player
                </button>
                <a
                  id="yt-source-link"
                  class="yt-link"
                  href="https://www.youtube.com/watch?v=t8yVk0bm684"
                  target="_blank"
                  rel="noopener noreferrer"
                  title="Open current music source on YouTube"
                >
                  ↗
                </a>
              </div>
              <form id="yt-url-form" class="yt-url-form" autocomplete="off">
                <input
                  id="yt-url-input"
                  class="yt-url-input"
                  type="text"
                  inputmode="url"
                  placeholder="Paste any YouTube link…"
                  aria-label="YouTube music link"
                />
                <button class="yt-url-submit" type="submit">Play</button>
              </form>
            </div>
          </details>
        </section>

        <section class="control-section" aria-label="Atmosphere and motion">
          <h2 class="section-label">Atmosphere &amp; Motion</h2>
          <div class="control-row">
            <button
              id="btn-mood"
              class="hud-btn"
              type="button"
              title="Cycle lighting mood"
            >
              <span>Mood: Default</span>
            </button>
            <button
              id="btn-drift"
              class="hud-btn"
              type="button"
              aria-pressed="true"
              title="Toggle gentle automatic camera drift"
            >
              <span class="dot" aria-hidden="true"></span>
              <span>Auto Drift</span>
            </button>
          </div>
          <button
            id="btn-pause"
            class="hud-btn hud-btn--full"
            type="button"
            title="Pause or resume all scene animation"
          >
            <span>Pause</span>
          </button>
        </section>

        <section id="terrace-controls" class="control-section" aria-label="Terrace interactions" hidden>
          <h2 class="section-label">Terrace</h2>
          <div class="control-row">
            <button id="btn-terrace-lamp" class="hud-btn" type="button" aria-pressed="true">Wall lamp</button>
            <button id="btn-next-stars" class="hud-btn" type="button">Next constellation</button>
          </div>
        </section>

        <p class="shortcut-hint">
          <kbd>F</kbd> full screen <span aria-hidden="true">·</span> <kbd>S</kbd> next scene
          <span aria-hidden="true">·</span> <kbd>Space</kbd> pause
        </p>
      </aside>

      <div id="yt-radio-wrap" class="yt-radio-wrap" aria-hidden="true">
        <div id="yt-radio-host"></div>
      </div>

      <div id="loading" class="loading-overlay">
        <div class="loading-inner">
          <div class="loading-lantern"></div>
          <div class="loading-wordmark">Lo-Fi Serene</div>
          <p>Lighting the lanterns…</p>
        </div>
      </div>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
